<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>情侶記帳 - 童話故事本</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Quicksand:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'macaron-pink': '#FFDFD3',
                        'macaron-rose': '#E2C2C6',
                        'macaron-blue': '#C4E0E5',
                        'macaron-green': '#D4E6B5',
                        'macaron-purple': '#E6CEE3',
                        'macaron-cream': '#FFF9EE',
                        'antique-gold': '#D4AF37',
                        'shimmer-gold': '#F9E59E',
                        'warm-brown': '#8D7B68',
                        'soft-ink': '#5D576B',
                        'paper': '#FFFDF7',
                        'parchment': '#F2E8D5',
                    },
                    fontFamily: {
                        'display': ['Newsreader', 'serif'],
                        'hand': ['Caveat', 'cursive'],
                        'sans': ['Quicksand', 'sans-serif'],
                        'heading': ['Nunito', 'sans-serif'],
                        'script': ['Pacifico', 'cursive'],
                    },
                    backgroundImage: {
                        'watercolor': "radial-gradient(circle at 10% 20%, rgba(255, 223, 211, 0.4) 0%, transparent 20%), radial-gradient(circle at 90% 80%, rgba(196, 224, 229, 0.4) 0%, transparent 20%), radial-gradient(circle at 50% 50%, rgba(255, 249, 238, 1) 0%, rgba(255, 240, 245, 0.5) 100%)",
                    },
                    boxShadow: {
                        'book': '0 10px 15px -3px rgba(74, 64, 54, 0.2), 0 4px 6px -2px rgba(74, 64, 54, 0.1)',
                        'floating': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'glow': '0 0 20px rgba(212, 175, 55, 0.4)',
                        'watercolor-layered': '0 4px 6px -1px rgba(141, 123, 104, 0.1), 0 2px 4px -1px rgba(141, 123, 104, 0.06), 0 0 0 1px rgba(255,255,255,0.5) inset',
                        'dreamy': '0 10px 40px -10px rgba(255, 209, 220, 0.6)',
                    }
                },
            },
        }
    </script>

    <style>
        body {
            background-color: #FFF9EE;
            min-height: 100dvh;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .lace-border {
            background-image: radial-gradient(circle at 50% 100%, white 5px, transparent 6px);
            background-size: 16px 16px;
            background-position: bottom;
            background-repeat: repeat-x;
        }

        .book-texture {
            background-image: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="paper" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.5" fill="rgba(141, 123, 104, 0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23paper)"/></svg>');
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.5; transform: scale(1.2) rotate(180deg); }
        }
    </style>
</head>
<body class="bg-watercolor font-sans text-soft-ink selection:bg-macaron-pink selection:text-white">

    <!-- 背景裝飾 -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-macaron-pink/30 rounded-full blur-[80px] mix-blend-multiply"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-macaron-blue/30 rounded-full blur-[80px] mix-blend-multiply"></div>
        <div class="absolute bottom-0 left-1/4 w-full h-80 bg-macaron-green/20 rounded-full blur-[100px] mix-blend-multiply"></div>

        <!-- 浮動星星 -->
        <div class="absolute top-32 right-8 text-antique-gold/60 text-xl animate-pulse duration-[3000ms]">✦</div>
        <div class="absolute top-48 left-6 text-antique-gold/40 text-lg animate-pulse duration-[4000ms]" style="animation-delay: 1s;">✧</div>
        <div class="absolute bottom-40 right-1/3 text-antique-gold/40 text-2xl animate-pulse duration-[5000ms]" style="animation-delay: 2s;">✦</div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen max-w-md mx-auto pb-28">

        <!-- 頂部導航欄 -->
        <div class="sticky top-0 z-50">
            <div class="bg-white/80 backdrop-blur-md pb-3 pt-4 px-5 border-b border-macaron-rose/20 shadow-sm relative">
                <div class="flex items-center justify-between">
                    <button class="size-10 flex items-center justify-center rounded-full border-2 border-macaron-pink/50 bg-white text-antique-gold hover:bg-macaron-pink/10 transition-colors shadow-sm">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <div class="flex flex-col items-center">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-antique-gold/60 text-[10px]">✦</span>
                            <span class="text-xs uppercase tracking-[0.2em] text-warm-brown font-bold font-sans">我們的童話</span>
                            <span class="text-antique-gold/60 text-[10px]">✦</span>
                        </div>
                        <h1 class="text-2xl font-hand font-bold text-soft-ink tracking-wide drop-shadow-sm" id="currentNotebookTitle">寶寶 & 步步</h1>
                    </div>
                    <button class="size-10 flex items-center justify-center rounded-full border-2 border-macaron-pink/50 bg-white text-antique-gold hover:bg-macaron-pink/10 transition-colors shadow-sm relative">
                        <span class="material-symbols-outlined">notifications</span>
                        <span class="absolute top-2 right-2.5 w-2.5 h-2.5 bg-macaron-rose rounded-full border-2 border-white"></span>
                    </button>
                </div>
                <div class="absolute -bottom-2 left-0 right-0 h-2 lace-border opacity-60"></div>
            </div>
        </div>

        <!-- 主要內容區 -->
        <main class="flex-1 px-6 pt-6 relative">

            <!-- 首頁 -->
            <div id="homePage" class="page active">
                <!-- 結算卡片 -->
                <div class="mb-10 relative group mx-2">
                    <div class="relative bg-white rounded-2xl p-1.5 shadow-watercolor-layered border-2 border-white overflow-hidden">
                        <div class="absolute top-0 left-0 w-8 h-8 border-t-[4px] border-l-[4px] border-macaron-pink/40 rounded-tl-xl z-20"></div>
                        <div class="absolute top-0 right-0 w-8 h-8 border-t-[4px] border-r-[4px] border-macaron-pink/40 rounded-tr-xl z-20"></div>
                        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-[4px] border-l-[4px] border-macaron-pink/40 rounded-bl-xl z-20"></div>
                        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-[4px] border-r-[4px] border-macaron-pink/40 rounded-br-xl z-20"></div>

                        <div class="relative bg-gradient-to-br from-macaron-cream to-white rounded-xl p-5 flex flex-col items-center text-center border border-dashed border-antique-gold/30">
                            <div class="flex items-center gap-2 mb-1 opacity-80">
                                <span class="material-symbols-outlined text-antique-gold text-sm">auto_awesome</span>
                                <span class="text-xs font-bold uppercase tracking-widest text-warm-brown">目前狀態</span>
                                <span class="material-symbols-outlined text-antique-gold text-sm">auto_awesome</span>
                            </div>
                            <div class="flex items-baseline gap-1 my-2 relative">
                                <span class="text-4xl font-bold text-soft-ink font-display" id="balanceStatus">已結清</span>
                                <div class="absolute -inset-4 bg-shimmer-gold/20 blur-xl rounded-full -z-10"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 視圖切換 -->
                <div class="flex gap-3 mb-6 px-2">
                    <button class="toggle-btn flex-1 py-3 px-4 rounded-2xl border-2 border-transparent bg-gradient-to-br from-macaron-pink to-[#E8A87C] text-white shadow-watercolor-layered font-hand font-bold text-lg hover:bg-white transition-all" data-view="list">
                        <span class="material-symbols-outlined inline-block mr-2">format_list_bulleted</span>列表
                    </button>
                    <button class="toggle-btn flex-1 py-3 px-4 rounded-2xl border-2 border-macaron-rose/50 bg-white/60 font-hand font-bold text-lg text-soft-ink hover:bg-white transition-all" data-view="calendar">
                        <span class="material-symbols-outlined inline-block mr-2">calendar_month</span>日曆
                    </button>
                </div>

                <!-- 列表視圖 -->
                <div id="listView" class="view-container active">
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-warm-brown/20 to-transparent border-t border-dashed border-warm-brown/30"></div>
                        <span class="material-symbols-outlined text-antique-gold text-xl">auto_stories</span>
                        <span class="text-xs font-bold uppercase tracking-widest text-warm-brown">近期冒險</span>
                        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-warm-brown/20 to-transparent border-t border-dashed border-warm-brown/30"></div>
                    </div>

                    <div id="transactionList" class="space-y-3">
                        <!-- 交易項目將由 JS 動態生成 -->
                    </div>

                    <button id="btnLoadMore" class="w-full mt-6 py-3 px-4 rounded-2xl border-2 border-dashed border-macaron-rose/50 bg-white/60 font-hand font-bold text-lg text-soft-ink hover:bg-white transition-all">
                        查看更多 ✨
                    </button>
                </div>

                <!-- 日曆視圖 -->
                <div id="calendarView" class="view-container hidden">
                    <div class="bg-white rounded-2xl p-5 shadow-watercolor-layered mb-4">
                        <div class="flex items-center justify-between mb-4">
                            <button id="prevMonth" class="w-10 h-10 rounded-full bg-macaron-pink/20 hover:bg-macaron-pink/40 flex items-center justify-center transition-colors">
                                <span class="material-symbols-outlined">chevron_left</span>
                            </button>
                            <h3 id="currentMonth" class="text-xl font-display font-bold text-soft-ink">2026年1月</h3>
                            <button id="nextMonth" class="w-10 h-10 rounded-full bg-macaron-pink/20 hover:bg-macaron-pink/40 flex items-center justify-center transition-colors">
                                <span class="material-symbols-outlined">chevron_right</span>
                            </button>
                        </div>

                        <div id="calendarGrid" class="grid grid-cols-7 gap-2">
                            <!-- 日曆格子將由 JS 動態生成 -->
                        </div>
                    </div>

                    <div id="dayDetails" class="bg-white rounded-2xl p-5 shadow-watercolor-layered">
                        <h4 id="selectedDate" class="text-lg font-hand font-bold mb-4 text-soft-ink">選擇日期查看交易</h4>
                        <div id="dayTransactions" class="space-y-3">
                            <!-- 當天交易明細 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 帳本頁面 -->
            <div id="notebooksPage" class="page hidden">
                <div class="mb-8 text-center relative">
                    <div class="inline-block relative">
                        <h2 class="text-3xl font-display italic font-semibold text-soft-ink relative z-10">我們的故事書</h2>
                        <div class="absolute -bottom-2 -left-4 -right-4 h-4 bg-macaron-pink/30 -skew-x-6 rounded-full -z-0 blur-[1px]"></div>
                    </div>
                    <p class="mt-3 text-sm text-warm-brown/80 font-hand text-lg">Continue your shared fairy tale...</p>
                </div>

                <div id="notebooksList" class="grid grid-cols-2 gap-x-6 gap-y-12 pb-4 px-2">
                    <!-- 帳本將由 JS 動態生成 -->
                </div>
            </div>

            <!-- 分析頁面 -->
            <div id="analyticsPage" class="page hidden">
                <div class="mb-8 text-center">
                    <h2 class="text-3xl font-display italic font-semibold text-soft-ink">財務魔法書</h2>
                    <p class="mt-2 text-sm text-warm-brown/80 font-hand text-lg">Analyze your spending journey</p>
                </div>

                <!-- 日期篩選 -->
                <div class="flex gap-2 mb-6 p-1.5 bg-white/60 rounded-full">
                    <button class="filter-btn flex-1 py-2 rounded-full font-hand font-bold text-sm transition-all bg-gradient-to-br from-macaron-pink to-[#E8A87C] text-white" data-period="month">本月</button>
                    <button class="filter-btn flex-1 py-2 rounded-full font-hand font-bold text-sm transition-all text-soft-ink" data-period="week">本週</button>
                    <button class="filter-btn flex-1 py-2 rounded-full font-hand font-bold text-sm transition-all text-soft-ink" data-period="custom">自訂</button>
                </div>

                <!-- 統計卡片 -->
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-white rounded-xl p-4 shadow-watercolor-layered text-center">
                        <p class="text-xs font-bold text-warm-brown mb-1">總支出</p>
                        <h3 class="text-xl font-display font-bold text-soft-ink" id="totalExpense">$0</h3>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-watercolor-layered text-center">
                        <p class="text-xs font-bold text-warm-brown mb-1">我的</p>
                        <h3 class="text-xl font-display font-bold text-soft-ink" id="myExpense">$0</h3>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-watercolor-layered text-center">
                        <p class="text-xs font-bold text-warm-brown mb-1">對方</p>
                        <h3 class="text-xl font-display font-bold text-soft-ink" id="partnerExpense">$0</h3>
                    </div>
                </div>

                <!-- 分類統計 -->
                <div class="bg-white rounded-2xl p-5 shadow-watercolor-layered mb-6">
                    <h3 class="text-lg font-hand font-bold mb-4 text-soft-ink">分類統計</h3>
                    <div id="categoryList" class="space-y-3">
                        <!-- 分類項目由 JS 動態生成 -->
                    </div>
                </div>

                <!-- 交易明細 -->
                <div>
                    <h3 class="text-lg font-hand font-bold mb-4 px-2 text-soft-ink">交易明細</h3>
                    <div id="analyticsTransactionList" class="space-y-3">
                        <!-- 交易明細 -->
                    </div>
                </div>
            </div>

        </main>

        <!-- 底部導航欄 -->
        <div class="fixed bottom-8 left-0 right-0 z-50 flex justify-center pointer-events-none">
            <div class="pointer-events-auto flex items-center gap-4 px-6 py-3 bg-white/90 rounded-full shadow-2xl border border-white/40 backdrop-blur-xl scale-100 hover:scale-105 transition-transform duration-300 ring-1 ring-macaron-pink/20 max-w-md">
                <button class="nav-item w-10 h-10 rounded-full text-warm-brown/40 hover:text-macaron-rose hover:bg-macaron-rose/10 transition-all flex items-center justify-center" data-page="notebooksPage">
                    <span class="material-symbols-outlined">menu_book</span>
                </button>
                <button class="nav-item active w-14 h-14 rounded-full bg-gradient-to-tr from-macaron-rose to-macaron-pink text-white shadow-lg flex items-center justify-center transform -translate-y-4 border-4 border-white ring-1 ring-macaron-rose/30 relative group" data-page="homePage">
                    <span class="material-symbols-outlined text-2xl group-hover:rotate-12 transition-transform">calendar_today</span>
                    <span class="absolute -top-1 -right-1 text-shimmer-gold text-[12px]" style="animation: sparkle 1.5s ease-in-out infinite;">✦</span>
                </button>
                <button class="nav-item w-10 h-10 rounded-full text-warm-brown/40 hover:text-macaron-rose hover:bg-macaron-rose/10 transition-all flex items-center justify-center" data-page="analyticsPage">
                    <span class="material-symbols-outlined">donut_small</span>
                </button>
            </div>
        </div>

        <!-- 浮動新增按鈕 -->
        <div class="fixed bottom-28 right-6 z-40">
            <button id="fabAdd" class="w-16 h-16 bg-gradient-to-tr from-[#E27D60] to-[#E8A87C] text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300 border-4 border-white relative group">
                <span class="material-symbols-outlined text-3xl group-hover:rotate-90 transition-transform">edit</span>
                <span class="absolute -top-2 -right-2 text-2xl" style="animation: sparkle 1.5s ease-in-out infinite;">✨</span>
            </button>
        </div>
    </div>

    <!-- 記帳表單 Bottom Sheet -->
    <div id="addTransactionSheet" class="bottom-sheet fixed inset-0 z-[100] hidden">
        <div class="bottom-sheet-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="bottom-sheet-content absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-[94vh] bg-paper rounded-t-[40px] shadow-2xl flex flex-col overflow-hidden lace-edge border-x border-[#EFE5E5]">
            <!-- 頂部裝飾 -->
            <div class="absolute top-3 left-4 right-4 h-0.5 border-t-2 border-dashed border-soft-ink/10 z-0"></div>
            <div class="absolute -top-1 right-8 w-10 h-16 bg-gradient-to-b from-macaron-pink to-[#E27D60] shadow-md flex items-end justify-center pb-2 z-20">
                <div class="w-0 h-0 border-l-[20px] border-r-[20px] border-b-[12px] border-l-transparent border-r-transparent border-b-paper mb-[-8px]"></div>
                <div class="absolute inset-x-1.5 bottom-4 top-0 border-x border-dashed border-white/40"></div>
            </div>

            <div class="pt-6 pb-2 px-6 flex flex-col items-center shrink-0 relative z-10">
                <button id="btnCloseSheet" class="flex h-6 w-20 items-center justify-center mb-1">
                    <div class="h-1.5 w-full rounded-full bg-[#D7CCC8]/60"></div>
                </button>
                <div class="flex items-center gap-2 mt-2">
                    <span class="material-symbols-outlined text-[#E27D60] text-xl" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
                    <span class="text-soft-ink text-2xl font-hand font-bold tracking-wide">新的一頁</span>
                </div>
            </div>

            <form id="transactionForm" class="flex-1 overflow-y-auto no-scrollbar px-6 pb-32 pt-2 relative">
                <div class="absolute inset-0 opacity-20 pointer-events-none book-texture"></div>

                <!-- 金額輸入 -->
                <div class="flex flex-col items-center justify-center py-6 relative">
                    <div class="absolute inset-0 bg-gradient-to-tr from-macaron-pink/20 via-transparent to-macaron-cream/20 blur-xl rounded-full scale-75"></div>
                    <div class="relative w-full text-center z-10">
                        <div class="flex items-baseline justify-center gap-1 text-soft-ink">
                            <span class="text-3xl font-hand font-bold text-warm-brown">$</span>
                            <input type="number" id="amount" name="amount" class="w-56 bg-transparent border-none p-0 text-[5rem] leading-none font-hand font-bold text-center text-[#E27D60] focus:ring-0 placeholder-[#E27D60]/20 drop-shadow-sm" placeholder="0" required autofocus>
                        </div>
                        <div class="h-2 w-32 mx-auto mt-0 relative">
                            <svg class="w-full h-full text-[#E27D60]/40" preserveAspectRatio="none" viewBox="0 0 100 10">
                                <path d="M0 5 Q 50 10 100 5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- 項目名稱 -->
                <div class="mb-8 relative z-20 group">
                    <label class="block text-warm-brown text-lg font-hand font-bold mb-1 ml-2 transform rotate-[-1deg]">
                        <span class="inline-block border-b-2 border-macaron-cream px-1">這是什麼？</span>
                    </label>
                    <div class="relative">
                        <div class="flex items-center bg-white/50 rounded-xl border-b-[3px] border-macaron-rose focus-within:border-[#E27D60]/50 focus-within:bg-white transition-all duration-300 shadow-sm">
                            <div class="pl-4 text-[#E27D60]/70">
                                <span class="material-symbols-outlined text-2xl">edit_note</span>
                            </div>
                            <input type="text" id="itemName" name="itemName" class="w-full bg-transparent border-none h-14 text-xl text-soft-ink placeholder-warm-brown/40 focus:ring-0 px-4 font-hand font-bold tracking-wide" placeholder="例如：魔法豆..." required>
                        </div>
                        <div class="absolute -right-2 -top-4 text-2xl filter drop-shadow-sm transform rotate-12 pointer-events-none">✨</div>
                    </div>
                </div>

                <!-- 誰付錢 -->
                <div class="mb-10">
                    <label class="block text-warm-brown text-lg font-hand font-bold mb-3 ml-2">誰是英雄？</label>
                    <div class="flex gap-3 justify-between">
                        <label class="flex-1 cursor-pointer group relative">
                            <input type="radio" name="payer" value="me" class="peer sr-only" checked>
                            <div class="h-16 rounded-2xl border-2 border-dashed border-macaron-rose bg-white/60 flex flex-col items-center justify-center transition-all duration-300 text-warm-brown hover:bg-white peer-checked:bg-gradient-to-br peer-checked:from-macaron-pink peer-checked:to-[#E8A87C] peer-checked:text-white peer-checked:border-none peer-checked:scale-105 peer-checked:shadow-watercolor-layered">
                                <span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">face_3</span>
                                <span class="text-sm font-bold font-hand">我</span>
                            </div>
                            <div class="absolute -top-2 -right-2 bg-antique-gold text-white rounded-full w-5 h-5 flex items-center justify-center shadow-sm scale-0 peer-checked:scale-100 transition-transform">
                                <span class="material-symbols-outlined text-xs font-bold">check</span>
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer group relative">
                            <input type="radio" name="payer" value="partner" class="peer sr-only">
                            <div class="h-16 rounded-2xl border-2 border-dashed border-macaron-rose bg-white/60 flex flex-col items-center justify-center transition-all duration-300 text-warm-brown hover:bg-white peer-checked:bg-gradient-to-br peer-checked:from-macaron-pink peer-checked:to-[#E8A87C] peer-checked:text-white peer-checked:border-none peer-checked:scale-105 peer-checked:shadow-watercolor-layered">
                                <span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">favorite</span>
                                <span class="text-sm font-bold font-hand">對方</span>
                            </div>
                            <div class="absolute -top-2 -right-2 bg-antique-gold text-white rounded-full w-5 h-5 flex items-center justify-center shadow-sm scale-0 peer-checked:scale-100 transition-transform">
                                <span class="material-symbols-outlined text-xs font-bold">check</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 幫誰付 -->
                <div class="mb-10">
                    <label class="block text-warm-brown text-lg font-hand font-bold mb-3 ml-2">幫誰付？</label>
                    <div class="flex gap-3 justify-between">
                        <label class="flex-1 cursor-pointer group relative">
                            <input type="radio" name="beneficiary" value="self" class="peer sr-only" checked>
                            <div class="h-14 rounded-2xl border-2 border-dashed border-macaron-rose bg-white/60 flex flex-col items-center justify-center transition-all duration-300 text-warm-brown hover:bg-white peer-checked:bg-gradient-to-br peer-checked:from-macaron-blue peer-checked:to-macaron-purple peer-checked:text-white peer-checked:border-none peer-checked:scale-105 peer-checked:shadow-watercolor-layered">
                                <span class="text-sm font-bold font-hand">自己</span>
                            </div>
                            <div class="absolute -top-2 -right-2 bg-antique-gold text-white rounded-full w-5 h-5 flex items-center justify-center shadow-sm scale-0 peer-checked:scale-100 transition-transform">
                                <span class="material-symbols-outlined text-xs font-bold">check</span>
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer group relative">
                            <input type="radio" name="beneficiary" value="partner" class="peer sr-only">
                            <div class="h-14 rounded-2xl border-2 border-dashed border-macaron-rose bg-white/60 flex flex-col items-center justify-center transition-all duration-300 text-warm-brown hover:bg-white peer-checked:bg-gradient-to-br peer-checked:from-macaron-blue peer-checked:to-macaron-purple peer-checked:text-white peer-checked:border-none peer-checked:scale-105 peer-checked:shadow-watercolor-layered">
                                <span class="text-sm font-bold font-hand">對方</span>
                            </div>
                            <div class="absolute -top-2 -right-2 bg-antique-gold text-white rounded-full w-5 h-5 flex items-center justify-center shadow-sm scale-0 peer-checked:scale-100 transition-transform">
                                <span class="material-symbols-outlined text-xs font-bold">check</span>
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer group relative">
                            <input type="radio" name="beneficiary" value="both" class="peer sr-only">
                            <div class="h-14 rounded-2xl border-2 border-dashed border-macaron-rose bg-white/60 flex flex-col items-center justify-center transition-all duration-300 text-warm-brown hover:bg-white peer-checked:bg-gradient-to-br peer-checked:from-macaron-blue peer-checked:to-macaron-purple peer-checked:text-white peer-checked:border-none peer-checked:scale-105 peer-checked:shadow-watercolor-layered">
                                <span class="text-sm font-bold font-hand">平分</span>
                            </div>
                            <div class="absolute -top-2 -right-2 bg-antique-gold text-white rounded-full w-5 h-5 flex items-center justify-center shadow-sm scale-0 peer-checked:scale-100 transition-transform">
                                <span class="material-symbols-outlined text-xs font-bold">check</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 分類 -->
                <div class="mb-10">
                    <label class="block text-warm-brown text-lg font-hand font-bold mb-4 ml-2">哪一章？</label>
                    <div class="grid grid-cols-4 gap-y-6 gap-x-4" id="categoryTags">
                        <button type="button" class="tag-btn group flex flex-col items-center gap-2" data-category="吃吃">
                            <div class="w-16 h-16 rounded-[40% 60% 70% 30% / 40% 50% 60% 50%] bg-macaron-pink/20 hover:bg-macaron-pink/40 flex items-center justify-center text-warm-brown group-hover:text-soft-ink transition-all group-active:scale-95 border-2 border-transparent hover:border-macaron-pink/30">
                                <span class="material-symbols-outlined text-2xl">restaurant</span>
                            </div>
                            <span class="text-sm font-hand font-bold text-warm-brown">吃吃</span>
                        </button>
                        <button type="button" class="tag-btn group flex flex-col items-center gap-2" data-category="玩">
                            <div class="w-16 h-16 rounded-[60% 40% 30% 70% / 60% 30% 70% 40%] bg-macaron-blue/20 hover:bg-macaron-blue/40 flex items-center justify-center text-warm-brown group-hover:text-soft-ink transition-all group-active:scale-95 border-2 border-transparent hover:border-macaron-blue/30">
                                <span class="material-symbols-outlined text-2xl">local_activity</span>
                            </div>
                            <span class="text-sm font-hand font-bold text-warm-brown">玩樂</span>
                        </button>
                        <button type="button" class="tag-btn group flex flex-col items-center gap-2" data-category="交通">
                            <div class="w-16 h-16 rounded-[30% 70% 70% 30% / 30% 30% 70% 70%] bg-macaron-green/20 hover:bg-macaron-green/40 flex items-center justify-center text-warm-brown group-hover:text-soft-ink transition-all group-active:scale-95 border-2 border-transparent hover:border-macaron-green/30">
                                <span class="material-symbols-outlined text-2xl">directions_subway</span>
                            </div>
                            <span class="text-sm font-hand font-bold text-warm-brown">交通</span>
                        </button>
                        <button type="button" class="tag-btn group flex flex-col items-center gap-2" data-category="購物">
                            <div class="w-16 h-16 rounded-[50% 50% 40% 60% / 50% 40% 60% 50%] bg-macaron-purple/20 hover:bg-macaron-purple/40 flex items-center justify-center text-warm-brown group-hover:text-soft-ink transition-all group-active:scale-95 border-2 border-transparent hover:border-macaron-purple/30">
                                <span class="material-symbols-outlined text-2xl">shopping_bag</span>
                            </div>
                            <span class="text-sm font-hand font-bold text-warm-brown">購物</span>
                        </button>
                        <button type="button" class="tag-btn group flex flex-col items-center gap-2" data-category="生活">
                            <div class="w-16 h-16 rounded-[40% 60% 60% 40% / 60% 30% 70% 40%] bg-macaron-cream/40 hover:bg-macaron-cream/60 flex items-center justify-center text-warm-brown group-hover:text-soft-ink transition-all group-active:scale-95 border-2 border-transparent hover:border-macaron-cream/50">
                                <span class="material-symbols-outlined text-2xl">cottage</span>
                            </div>
                            <span class="text-sm font-hand font-bold text-warm-brown">生活</span>
                        </button>
                        <button type="button" class="tag-btn group flex flex-col items-center gap-2" data-category="其他">
                            <div class="w-16 h-16 rounded-full border-2 border-dashed border-warm-brown/30 flex items-center justify-center text-warm-brown/50 hover:border-[#E27D60]/50 hover:text-[#E27D60] transition-all group-active:scale-95 bg-white/30">
                                <span class="material-symbols-outlined text-2xl">add</span>
                            </div>
                            <span class="text-sm font-hand font-bold text-warm-brown">其他</span>
                        </button>
                    </div>
                </div>

                <!-- 照片上傳 -->
                <div class="mb-8">
                    <label class="block text-warm-brown text-lg font-hand font-bold mb-3 ml-2">捕捉記憶</label>
                    <input type="file" id="photoInput" accept="image/*" class="hidden">
                    <div id="btnUploadPhoto" class="w-full h-36 rounded-2xl border-4 border-macaron-rose/30 bg-white relative flex flex-col items-center justify-center gap-2 cursor-pointer group shadow-sm overflow-hidden">
                        <div class="absolute inset-0 opacity-10 book-texture"></div>
                        <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-24 h-6 bg-[#E0E0E0]/60 rotate-2 backdrop-blur-sm z-10 shadow-sm"></div>
                        <div class="w-14 h-14 rounded-full bg-macaron-cream flex items-center justify-center text-[#E27D60] group-hover:scale-110 transition-all duration-300 shadow-inner">
                            <span class="material-symbols-outlined text-3xl">add_a_photo</span>
                        </div>
                        <span class="text-sm font-hand font-bold text-warm-brown/70 relative z-10">貼上照片</span>
                        <div id="photoPreview" class="mt-2"></div>
                    </div>
                </div>

                <!-- 日期 -->
                <div class="mb-8">
                    <label class="block text-warm-brown text-lg font-hand font-bold mb-3 ml-2">日期</label>
                    <div class="flex items-center bg-white/50 rounded-xl border-b-[3px] border-macaron-rose shadow-sm">
                        <div class="pl-4 text-[#E27D60]/70">
                            <span class="material-symbols-outlined text-2xl">calendar_today</span>
                        </div>
                        <input type="date" id="transactionDate" name="transactionDate" class="w-full bg-transparent border-none h-14 text-lg text-soft-ink focus:ring-0 px-4 font-hand font-bold" required>
                    </div>
                </div>

                <!-- 提交按鈕 -->
                <div class="absolute bottom-0 left-0 right-0 p-6 z-30">
                    <div class="absolute bottom-full left-0 right-0 h-12 bg-gradient-to-t from-paper to-transparent pointer-events-none"></div>
                    <button type="submit" class="w-full h-16 bg-gradient-to-r from-[#E27D60] to-[#E8A87C] hover:from-[#d66c4f] hover:to-[#db996d] text-white rounded-xl font-hand font-bold text-2xl shadow-watercolor-layered flex items-center justify-center gap-3 transition-transform transform active:scale-[0.98] relative overflow-hidden group border-b-[6px] border-[#BF5D42]">
                        <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                        <span class="material-symbols-outlined">auto_stories</span>
                        <span>記入日記</span>
                        <span class="material-symbols-outlined text-sm opacity-60">edit</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
